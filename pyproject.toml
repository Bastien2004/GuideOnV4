[project]
name = "guideon"
version = "4.0.0"
description = "Bot Discord GuideON V4"
requires-python = ">=3.12"

dependencies = [

    # Discord
    "discord.py>=2.4,<3.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",

    # API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "slowapi>=0.1.9",

    # Config & validation
    "pydantic>=2.6",
    "pydantic-settings>=2.2",

    # HTTP client
    "httpx>=0.27",

    # Imaging
    "pillow>=10.2",
    "pandas>=3.0.3",

    # Files
    "aiofiles>=23.2",
    "pynacl>=1.5",

    # Gestion
    "matplotlib">=3.10.9

    # Temps
    "tzdata>=2024.1; sys_platform == 'win32'"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "RUF"]
ignore = ["E501"]

# ====================================================================
# Setuptools — on désactive la "package discovery" auto.
# GuideON n'est pas un package publié, c'est une application multi-dossiers.
# Cette config dit explicitement à setuptools "n'essaie pas de deviner".
# ====================================================================
[tool.setuptools]
py-modules = []